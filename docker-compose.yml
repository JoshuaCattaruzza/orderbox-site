version: "3.9"

services:
  web:
    image: nginx:alpine
    container_name: orderbox-site
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./about.html:/usr/share/nginx/html/about.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.orderbox-site.rule=Host(`orderbox.me`)"
      - "traefik.http.routers.orderbox-site.entrypoints=websecure"
      - "traefik.http.routers.orderbox-site.tls.certresolver=letsencrypt"

networks:
  traefik_proxy:
    external: true
